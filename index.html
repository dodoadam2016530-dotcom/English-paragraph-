
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>English Beach</title>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  font-family:Arial,sans-serif;
  color:#073b59;
  background:#9ceaff;
}
header{
  text-align:center;
  padding:25px 12px;
  background:linear-gradient(#43caff,#e0faff);
}
header h1{font-size:32px;margin:8px}
.score{
  display:inline-block;
  background:white;
  padding:12px 20px;
  border-radius:25px;
  font-weight:bold;
}
.beach{
  min-height:75vh;
  padding:25px 15px 50px;
  background:
    radial-gradient(circle at 88% 8%,#fff7a7 0 34px,
    #ffbf39 35px 42px,transparent 43px),
    linear-gradient(to bottom,#a9efff 0%,#b9f0ff 18%,
    #28c6ed 19%,#087bb4 65%,#ffe5a2 66%,#f7d18a 100%);
}
.intro{
  max-width:600px;
  margin:0 auto 25px;
  padding:18px;
  border-radius:20px;
  text-align:center;
  background:#ffffffed;
}
.names{
  display:grid;
  grid-template-columns:repeat(2,minmax(0,220px));
  justify-content:center;
  gap:18px;
  max-width:500px;
  margin:auto;
}
.name{
  border:3px solid white;
  background:#ffffffef;
  border-radius:22px;
  padding:25px 10px;
  cursor:pointer;
  color:#075477;
  font-size:20px;
  font-weight:bold;
  box-shadow:0 6px 14px #00354c30;
  transition:.2s;
}
.name:hover{transform:translateY(-5px);background:#fff5c9}
.name span{display:block;font-size:38px;margin-bottom:12px}
.name.done{background:#d5ffe4;border-color:#16a765}
footer{text-align:center;background:#fff0c6;padding:20px}
.modal{
  display:none;
  position:fixed;
  inset:0;
  padding:15px;
  overflow:auto;
  background:#00283dcc;
  z-index:5;
}
.panel{
  max-width:700px;
  margin:20px auto;
  background:white;
  border-radius:22px;
  padding:24px;
}
.panel h2{color:#008cbb}
#paragraph{line-height:1.9;font-size:17px;color:#24485b}
.action{
  border:0;
  border-radius:12px;
  padding:13px 17px;
  margin:5px;
  cursor:pointer;
  font-weight:bold;
}
.complete{background:#13a765;color:white}
.close{background:#e8f5fa;color:#075477}
.action:disabled{opacity:.65;cursor:default}
</style>
</head>

<body>

<header>
  <div style="font-size:43px">☀️ 🏖️ 🌴</div>
  <h1>English Beach</h1>
  <p>Choose your name and read your paragraph!</p>
  <div class="score">⭐ Score: <span id="score">0</span> / 40</div>
</header>

<main class="beach">
  <div class="intro">
    <h2>🌊 Welcome to the Beach!</h2>
    <p>Choose your name to read your own paragraph.</p>
    <p>Each person has 10 sentences and can earn 10 points.</p>
  </div>

  <div class="names">
    <button class="name" id="name0" onclick="openParagraph(0)">
      <span>🧒🏻</span>Adam
    </button>
    <button class="name" id="name1" onclick="openParagraph(1)">
      <span>👦🏽</span>Yassin
    </button>
    <button class="name" id="name2" onclick="openParagraph(2)">
      <span>👦🏻</span>Hamza
    </button>
    <button class="name" id="name3" onclick="openParagraph(3)">
      <span>👦🏼</span>Modather
    </button>
  </div>
</main>

<footer>🐚 Learn English • Read • Explore 🐠</footer>

<div class="modal" id="modal">
  <div class="panel">
    <h2 id="title"></h2>
    <p id="paragraph"></p>
    <p><b>⭐ Complete your paragraph to earn 10 points.</b></p>
    <button class="action complete" id="complete"
      onclick="finishParagraph()">Complete (+10)</button>
    <button class="action close" onclick="closeParagraph()">Back</button>
  </div>
</div>

<script>
const people = [
  {
    name:"Adam",
    sentences:[
      "The beach is a beautiful place.",
      "I love going to the beach.",
      "The sea is blue and clear.",
      "The sun shines brightly in the sky.",
      "The sand is soft and warm.",
      "I like walking on the sand.",
      "My family comes to the beach with me.",
      "We enjoy spending time together.",
      "I can hear the sound of the waves.",
      "I feel happy at the beach."
    ]
  },
  {
    name:"Yassin",
    sentences:[
      "I enjoy visiting the beach with my friends.",
      "We like playing football on the sand.",
      "Sometimes we build a big sandcastle.",
      "The sandcastle looks beautiful.",
      "We collect pretty seashells.",
      "Some children are flying colorful kites.",
      "The kites move in the wind.",
      "I can see boats on the water.",
      "Seagulls fly above the sea.",
      "We have a wonderful time together."
    ]
  },
  {
    name:"Hamza",
    sentences:[
      "I like swimming in the sea.",
      "The water feels cool on a hot day.",
      "I always follow the beach safety rules.",
      "My family sits under a big umbrella.",
      "We eat delicious sandwiches for lunch.",
      "We drink cold water when we feel thirsty.",
      "I wear a hat to protect myself from the sun.",
      "I use sunscreen to protect my skin.",
      "The sea breeze feels fresh.",
      "I enjoy every moment at the beach."
    ]
  },
  {
    name:"Modather",
    sentences:[
      "The beach looks wonderful at sunset.",
      "The sky becomes orange and pink.",
      "The waves move gently towards the shore.",
      "I take beautiful pictures with my family.",
      "We laugh and play together.",
      "I never leave rubbish on the sand.",
      "I always put rubbish in a bin.",
      "Keeping the beach clean is very important.",
      "I feel happy after a day at the beach.",
      "I hope to visit the beach again soon."
    ]
  }
];

let completed = new Set();
let current = -1;

function openParagraph(index){
  current = index;
  const person = people[index];

  document.getElementById("title").textContent =
    "🏖️ " + person.name + " - On the Beach";

  document.getElementById("paragraph").textContent =
    person.sentences.join(" ");

  document.getElementById("modal").style.display = "block";

  const button = document.getElementById("complete");
  button.disabled = completed.has(index);
  button.textContent = completed.has(index)
    ? "Completed ✓"
    : "Complete (+10)";
}

function closeParagraph(){
  document.getElementById("modal").style.display = "none";
}

function finishParagraph(){
  if(current < 0 || completed.has(current)) return;

  completed.add(current);

  document.getElementById("score").textContent =
    completed.size * 10;

  document.getElementById("name" + current).classList.add("done");

  const button = document.getElementById("complete");
  button.disabled = true;
  button.textContent = "Completed ✓";
}

document.getElementById("modal").addEventListener("click",function(event){
  if(event.target === this) closeParagraph();
});
</script>

</body>
</html>
